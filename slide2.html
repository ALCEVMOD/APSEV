<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Slide 2 - Scan RFID card</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    font-family:Arial, Helvetica, sans-serif;
    background:#efefef;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.device{

    width:min(92vw,900px);

    aspect-ratio:1/1.05;

    background:linear-gradient(
        145deg,
        #727272,
        #5e5e5e
    );

    border-radius:32px;

    padding:3%;

    display:flex;
    flex-direction:column;

    box-shadow:
        inset 0 2px 8px rgba(255,255,255,.15),
        inset 0 -3px 8px rgba(0,0,0,.25),
        0 12px 30px rgba(0,0,0,.25);
}

/* ===== TOP SCREEN AREA ===== */

.screen-section{
    flex:4;
    display:flex;
    align-items:center;
    justify-content:center;
}

.screen-frame{

    width:92%;
    height:88%;

    background:#111;

    border-radius:22px;

    padding:12px;

    box-shadow:
        inset 0 0 10px rgba(255,255,255,.08);
}

.screen{

    width:100%;
    height:100%;

    background:
        radial-gradient(
            circle at center,
            #4d7298,
            #24384f
        );

    border-radius:12px;

    display:flex;
    flex-direction:column;
}

.screen-content{

    flex:1;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:4%;
}

.screen-content h1{
    font-size:clamp(1.7rem,4vw,3.8rem);
    color:white;
    margin-bottom:1rem;
}

.screen-content p{
    font-size:clamp(1rem,1.8vw,1.5rem);
    color:#dbe8f4;
}

.navigation{

    display:flex;
    justify-content:space-between;

    padding:16px;
}

.button{

    text-decoration:none;

    background:white;

    color:#222;

    padding:10px 20px;

    border-radius:8px;

    font-weight:bold;

    font-size:clamp(.9rem,1vw,1.1rem);
}

.button:hover{
    background:#ececec;
}

/* ===== RFID SECTION ===== */
.rfid-section{
    flex:0.6;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.scan-card{

    position:absolute;

    left:55%;
    bottom:30px;

    z-index:10;

    width:110px;
    height:70px;

    background:white;

    border:2px solid #000;

    border-radius:8px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-weight:bold;
    font-size:14px;

    color:#000;

    box-shadow:2px 2px 0 rgba(0,0,0,.15);

    animation:scanMotion 2s ease-in-out infinite;
}

@keyframes scanMotion{

    0%,100%{
        transform:
            rotate(-25deg)
            translateY(0px);
    }

    50%{
        transform:
            rotate(-25deg)
            translateY(12px);
    }
}.rfid-section{

    flex:0.6;

    display:flex;
    align-items:center;
    justify-content:center;
}

.rfid-icon{

    width:22%;
    min-width:90px;
    max-width:150px;
}

.rfid-icon svg{
    width:100%;
    height:auto;
}

.rfid-label{
    text-align:center;
    font-size:clamp(0.9rem,1.5vw,1.2rem);
    color:#111;
    font-weight:bold;
    margin-top:4px;
}

/* Mobile */

@media (max-width:600px){

    .device{
        width:95vw;
    }

    .rfid-icon{
        width:28%;
    }

}
</style>
</head>

<body>

<div class="device">

    <!-- SCREEN AREA -->

    <div class="screen-section">

                    <p>

                    </p>

                </div>

                <div class="navigation">
                    <span></span>
                    <a href="slide3.html" class="button">Next →</a>
                </div>

            </div>

        </div>

    </div>

    <!-- RFID AREA -->

    <div class="rfid-section">
<div class="scan-card">
RFID Card
