<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Charger</title>

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#efefef;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

svg{
    width:100%;
    height:100%;
    display:block;
}
.navigation{

    display:flex;
    justify-content:space-between;

    padding:16px;
}
.button{

    text-decoration:none;

    background:white;

    color:#222;

    padding:10px 20px;

    border-radius:8px;

    font-weight:bold;

    font-size:clamp(.9rem,1vw,1.1rem);
}

.button:hover{
    background:#ececec;
}

</style>

</head>
<body>
<div><a href="slide6.html" class="button">Back to screen →</a></div>
<svg
    viewBox="0 0 1920 1080"
    preserveAspectRatio="xMidYMid meet"
    xmlns="http://www.w3.org/2000/svg">

    <defs>

        <linearGradient id="silver">
            <stop offset="0%" stop-color="#d8d8d8"/>
            <stop offset="50%" stop-color="#f4f4f4"/>
            <stop offset="100%" stop-color="#c4c4c4"/>
        </linearGradient>

        <linearGradient id="screenGlow">
            <stop offset="0%" stop-color="#7ba4cc"/>
            <stop offset="100%" stop-color="#1d3042"/>
        </linearGradient>

    </defs>

    <!-- Background -->

    <rect width="1920"
          height="1080"
          fill="#efefef"/>

    <!-- Title -->

    <text x="960"
          y="105"
          text-anchor="middle"
          font-family="Arial"
          font-weight="700"
          font-size="82">
        Connect Charger
    </text>

    <!-- ================================= -->
    <!-- CONTENT GROUP -->
    <!-- ================================= -->

    <g transform="translate(140,190) scale(.52)">

        <!-- ============================ -->
        <!-- CHARGER -->
        <!-- ============================ -->

        <g>

            <rect x="205"
                y="950"
                width="90"
                height="35"
                fill="#e6e6e6"/>

            <rect x="180"
                y="985"
                width="140"
                height="8"
                fill="#cccccc"/>

            <rect x="205"
                y="180"
                width="90"
                height="770"
                fill="url(#silver)"/>

            <!-- Screen Module -->

            <rect
                x="150"
                y="40"
                width="200"
                height="170"
                rx="18"
                fill="#666"/>

            <rect
                x="170"
                y="55"
                width="160"
                height="90"
                rx="10"
                fill="#111"/>

            <rect
                x="178"
                y="63"
                width="144"
                height="74"
                rx="6"
                fill="url(#screenGlow)"/>

            <!-- RFID -->

            <g transform="translate(250,175)">

                <rect
                    x="-14"
                    y="-10"
                    width="28"
                    height="20"
                    rx="3"
                    fill="none"
                    stroke="#111"
                    stroke-width="2"/>

                <text
                    x="0"
                    y="5"
                    font-size="10"
                    text-anchor="middle"
                    font-family="Arial">
                    RFID
                </text>

                <path
                    d="M18,-2 A8 8 0 0 0 18,-18"
                    fill="none"
                    stroke="#111"
                    stroke-width="2"/>

                <path
                    d="M24,4 A15 15 0 0 0 24,-24"
                    fill="none"
                    stroke="#111"
                    stroke-width="2"/>

            </g>

            <!-- Charger body -->

            <rect
                x="150"
                y="260"
                width="200"
                height="250"
                rx="42"
                fill="url(#silver)"/>

            <!-- Fascia -->

            <path
                d="
                M150 320
                L350 375
                L350 485
                L150 430
                Z"
                fill="#000"/>


        </g>

        <!-- ============================ -->
        <!-- CABLE -->
        <!-- ============================     M234 520
    C320 1000
    650 410
    860 395
    C960 385
    1035 365
    1107 675-->

<path d="
    M234 520
    C320 750
    500 620
    750 630
    C900 635
    1000 655
    1210 660
"
fill="none"
stroke="blue"
stroke-width="12"
stroke-linecap="round"/>
<!-- connector tip -->
<!-- Charging gun plugged into vehicle -->

<g transform="translate(1210,660)">

    <!-- rear cable socket -->
    <rect
        x="-18"
        y="-8"
        width="20"
        height="16"
        rx="2"
        fill="#222"/>

    <!-- handle -->
    <rect
        x="0"
        y="-12"
        width="42"
        height="24"
        rx="4"
        fill="#f1f1f1"
        stroke="#999"
        stroke-width="2"/>

    <!-- grip -->
    <path d="
        M24 8
        L45 8
        L55 35
        L38 40
        L18 16
        Z"
        fill="#d9d9d9"
        stroke="#999"
        stroke-width="2"/>

    <!-- plug nose -->
    <rect
        x="42"
        y="-7"
        width="16"
        height="14"
        rx="2"
        fill="#333"/>

</g>
        <!-- ============================ -->
        <!-- VEHICLE -->
        <!-- ============================ -->

        <g transform="translate(1020,160) scale(1.65)">

            <g fill="none"
               stroke="#000"
               stroke-width="8"
               stroke-linecap="round"
               stroke-linejoin="round">

                <path d="
                  M195 80
                  Q400 60 600 80
                  L660 340
                  L650 520
                  L560 520
                  L550 430
                  L250 430
                  L240 520
                  L150 520
                  L140 340
                  Z"/>

                <path d="
                  M220 100
                  Q400 90 580 100
                  L620 240
                  L180 240
                  L210 100
                  Z"/>

                <line x1="180" y1="255" x2="620" y2="255"/>

                <path d="M360 222 L250 220"/>
                <path d="M440 222 L550 220"/>

                <rect x="95" y="205" width="55" height="80" rx="18"/>
                <rect x="650" y="205" width="55" height="80" rx="18"/>

                <line x1="150" y1="245" x2="175" y2="255"/>
                <line x1="650" y1="245" x2="625" y2="255"/>

                <rect x="180" y="300" width="65" height="65" rx="8"/>
                <rect x="555" y="300" width="65" height="65" rx="8"/>

                <rect x="270" y="300" width="260" height="75" rx="12"/>

                <rect x="250"
                      y="390"
                      width="300"
                      height="35"
                      rx="4"/>

                <rect x="160"
                      y="390"
                      width="65"
                      height="30"
                      rx="8"/>

                <rect x="575"
                      y="390"
                      width="65"
                      height="30"
                      rx="8"/>

                <line x1="150"
                      y1="430"
                      x2="648"
                      y2="430"/>

            </g>

            <!-- charge port -->

<rect x="392"
      y="339"
      width="18"
      height="18"
      rx="2"
      fill="#111"/>
            <!-- charging light -->

 <circle
    cx="401"
    cy="347"
    r="18"
    fill="#22c55e"
    opacity=".18"/>

<circle
    cx="401"
    cy="347"
    r="7"
    fill="#22c55e"/>

        </g>

    </g>

</svg>
                <div class="navigation">
                    <span></span>
                    <a href="slide7.html" class="button">Back to screen →</a>
                </div>

</body>
</html>
