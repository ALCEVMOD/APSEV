<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV Charger SVG</title>

<style>
body{
    margin:0;
    background:#efefef;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

svg{
    width:min(90vw,500px);
    height:auto;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    font-family:Arial, Helvetica, sans-serif;
    background:#efefef;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.device{

    width:min(92vw,900px);

    aspect-ratio:1/1.05;

    background:linear-gradient(
        145deg,
        #727272,
        #5e5e5e
    );

    border-radius:32px;

    padding:3%;

    display:flex;
    flex-direction:column;

    box-shadow:
        inset 0 2px 8px rgba(255,255,255,.15),
        inset 0 -3px 8px rgba(0,0,0,.25),
        0 12px 30px rgba(0,0,0,.25);
}

/* ===== TOP SCREEN AREA ===== */

.screen-section{
    flex:4;
    display:flex;
    align-items:center;
    justify-content:center;
}

.screen-frame{

    width:92%;
    height:88%;

    background:#111;

    border-radius:22px;

    padding:12px;

    box-shadow:
        inset 0 0 10px rgba(255,255,255,.08);
}

.screen{

    width:100%;
    height:100%;

    background:
        radial-gradient(
            circle at center,
            #4d7298,
            #24384f
        );

    border-radius:12px;

    display:flex;
    flex-direction:column;
}

.screen-content{

    flex:1;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:4%;
}

.screen-content h1{
    font-size:clamp(1.7rem,4vw,3.8rem);
    color:white;
    margin-bottom:1rem;
}

.screen-content p{
    font-size:clamp(1rem,1.8vw,1.5rem);
    color:#dbe8f4;
}

.navigation{

    display:flex;
    justify-content:space-between;

    padding:16px;
}

.button{

    text-decoration:none;

    background:white;

    color:#222;

    padding:10px 20px;

    border-radius:8px;

    font-weight:bold;

    font-size:clamp(.9rem,1vw,1.1rem);
}

.button:hover{
    background:#ececec;
}

/* ===== RFID SECTION ===== */

.rfid-section{

    flex:0.6;

    display:flex;
    align-items:center;
    justify-content:center;
}

.rfid-icon{

    width:22%;
    min-width:90px;
    max-width:150px;
}

.rfid-icon svg{
    width:100%;
    height:auto;
}

.rfid-label{
    text-align:center;
    font-size:clamp(0.9rem,1.5vw,1.2rem);
    color:#111;
    font-weight:bold;
    margin-top:4px;
}

/* Mobile */

@media (max-width:600px){

    .device{
        width:95vw;
    }

    .rfid-icon{
        width:28%;
    }

}
</style>
</head>
<body>
<div class="device">

    <!-- SCREEN AREA -->

    <div class="screen-section">

        <div class="screen-frame">

            <div class="screen">

                <div class="screen-content">

                    <h1>Welcome</h1>

                    <p>
                        Tap your RFID card below to begin EV charging session.
                    </p>

                </div>

                <div class="navigation">
                    <span></span>
                    <a href="Start.html" class="button">Next →</a>
                </div>

            </div>

        </div>

    </div>

    <!-- RFID AREA -->

    <div class="rfid-section">

        <div class="rfid-icon">

            <svg viewBox="0 0 140 100">

                <rect
                    x="10"
                    y="28"
                    width="60"
                    height="44"
                    rx="6"
                    ry="6"
                    fill="none"
                    stroke="#000"
                    stroke-width="4"/>

                <text
                    x="40"
                    y="57"
                    text-anchor="middle"
                    font-size="18"
                    font-weight="700"
                    font-family="Arial">
                    RFID
                </text>

                <circle
                    cx="82"
                    cy="48"
                    r="4"
                    fill="#000"/>

                <path
                    d="M90 48 A12 12 0 0 0 90 28"
                    fill="none"
                    stroke="#000"
                    stroke-width="4"/>

                <path
                    d="M102 54 A24 24 0 0 0 102 22"
                    fill="none"
                    stroke="#000"
                    stroke-width="4"/>

                <path
                    d="M116 60 A36 36 0 0 0 116 16"
                    fill="none"
                    stroke="#000"
                    stroke-width="4"/>

            </svg>

            <div class="rfid-label">
                Scan RFID Tag
            </div>

        </div>

    </div>

</div>

<svg viewBox="0 0 500 1100" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="silver" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#d8d8d8"/>
      <stop offset="50%" stop-color="#f4f4f4"/>
      <stop offset="100%" stop-color="#c4c4c4"/>
    </linearGradient>

    <linearGradient id="screenGlow"
                    x1="50%" y1="50%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ba4cc"/>
      <stop offset="100%" stop-color="#1d3042"/>
    </linearGradient>

    <linearGradient id="cable"
                    x1="0%"
                    x2="100%">
      <stop offset="0%" stop-color="#090909"/>
      <stop offset="50%" stop-color="#303030"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>

  </defs>

  <!-- BASE -->

  <rect x="205"
        y="1030"
        width="90"
        height="40"
        fill="#ececec"/>

  <rect x="180"
        y="1070"
        width="140"
        height="8"
        fill="#d5d5d5"/>

  <!-- MAIN PEDESTAL -->

  <rect x="205"
        y="180"
        width="90"
        height="850"
        fill="url(#silver)"/>

<!-- TOP SCREEN MODULE -->

<g>

  <rect
      x="150"
      y="40"
      width="200"
      height="170"
      rx="18"
      fill="#666"
  />

  <!-- Screen Bezel -->
  <rect
      x="170"
      y="55"
      width="160"
      height="90"
      rx="10"
      fill="#111"
  />

  <!-- Screen -->
  <rect
      x="178"
      y="63"
      width="144"
      height="74"
      rx="6"
      fill="url(#screenGlow)"
  />

  <!-- RFID Symbol -->
  <g transform="translate(250,175)">

      <rect
          x="-14"
          y="-10"
          width="28"
          height="20"
          rx="3"
          fill="none"
          stroke="#111"
          stroke-width="2"/>

      <text
          x="0"
          y="5"
          font-size="10"
          text-anchor="middle"
          font-family="Arial"
          font-weight="700">
          RFID
      </text>

      <path
          d="M18,-2 A8 8 0 0 0 18,-18"
          fill="none"
          stroke="#111"
          stroke-width="2"/>

      <path
          d="M24,4 A15 15 0 0 0 24,-24"
          fill="none"
          stroke="#111"
          stroke-width="2"/>

  </g>

</g>


    </g>

  </g>

  <!-- CHARGER BODY -->

  <rect
      x="150"
      y="260"
      width="200"
      height="250"
      rx="42"
      fill="url(#silver)"
  />

  <!-- BLACK FASCIA -->

  <path
      d="
      M150 320
      L350 375
      L350 485
      L150 430
      Z"
      fill="#000"
  />

  <!-- PORTS -->

  <rect x="222"
        y="510"
        width="10"
        height="18"
        fill="#222"/>

  <rect x="268"
        y="510"
        width="10"
        height="18"
        fill="#222"/>

  <!-- RFID TAG -->

  <line x1="405"
        y1="425"
        x2="405"
        y2="490"
        stroke="#111"
        stroke-width="1.5"/>

  <rect x="398"
        y="490"
        width="14"
        height="28"
        rx="2"
        fill="#111"/>

  <!-- EV GUN -->

  <g>

    <rect x="350"
          y="390"
          width="22"
          height="28"
          fill="#222"/>

    <path d="
      M372 392
      L430 392
      Q444 392 454 401
      L470 413
      Q474 418 474 426
      L466 432
      L454 438
      L392 438
      Q378 438 372 426
      Z"
      fill="#efefef"
      stroke="#c8c8c8"/>

    <path d="
      M452 404
      L485 418
      L480 432
      L448 418
      Z"
      fill="#dedede"/>

    <rect x="480"
          y="414"
          width="16"
          height="20"
          rx="2"
          fill="#333"/>

    <path d="
      M420 435
      L445 458
      Q452 466 447 474
      L438 493
      Q435 499 428 496
      L416 490
      Q412 486 413 478
      Z"
      fill="#ededed"
      stroke="#c8c8c8"/>

    <path d="
      M419 437
      Q432 447 432 462"
      fill="none"
      stroke="#666"
      stroke-width="2"/>

  </g>

  <!-- MAIN CABLE -->

  <path d="
      M438 485
      C600 570 585 845 420 950
      C340 1005 240 995 175 915
      C95 815 110 670 230 670
      C325 670 370 745 350 825
      C332 895 255 930 190 900"
      fill="none"
      stroke="url(#cable)"
      stroke-width="16"
      stroke-linecap="round"/>

  <!-- CABLE LOOP -->

  <ellipse cx="250"
           cy="820"
           rx="90"
           ry="120"
           fill="none"
           stroke="url(#cable)"
           stroke-width="16"/>

  <!-- CABLE HOLDER -->

  <rect x="228"
        y="700"
        width="44"
        height="36"
        rx="6"
        fill="#d9d9d9"
        stroke="#888"/>

  <rect x="242"
        y="708"
        width="18"
        height="20"
        fill="#111"/>

</svg>
</body>
</html>
